name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ilias-mcp --version
      - name: ilias-mcp-config dry run
        run: ilias-mcp-config add --user ci.user --config ci-config.json --dry-run
      - name: setup.ps1 parses in Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: setup.sh parses in Bash
        if: runner.os != 'Windows'
        run: bash -n setup.sh
      - name: Verify credential storage in macOS Keychain
        if: runner.os == 'macOS' && matrix.python-version == '3.13'
        timeout-minutes: 2
        run: |
          keychain="$RUNNER_TEMP/ilias-mcp-test.keychain-db"
          security create-keychain -p test-keychain "$keychain"
          trap 'security delete-keychain "$keychain"' EXIT
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p test-keychain "$keychain"
          python - <<'PY'
          from ilias_mcp.credentials import keychain_password, save_password

          for password in ("temporary password", "updated påssword"):
              save_password("ilias-mcp-test", "ci.user", password)
              assert keychain_password("ilias-mcp-test", "ci.user") == password
          PY
